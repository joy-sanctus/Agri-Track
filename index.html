<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriTrack UG</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#0f1f14;color:#fff}
header{background:#14532d;padding:16px;position:sticky;top:0}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:90px}
.card{background:#1a2f22;border:1px solid #2d4a35;border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:13px;display:block;margin:10px 0 5px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #3a5a44;background:#0f1f14;color:#fff;font-size:15px}
button.primary{width:100%;background:#22c55e;color:#062a12;border:0;padding:13px;border-radius:12px;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>🌱 AgriTrack UG</h1>
<p>Digital Farming Hub • KPAI - Bukulula, Kalungu</p>
</header>
<main>
<div class="card">
<h3>👋 Welcome, Farmer</h3>
<p>Track your farm, save on fertilizer, reduce losses. Works offline.</p>
</div>
<div class="card">
<h3>➕ Add Your Farm</h3>
<label>Farmer Name</label>
<input id="farmerName" placeholder="e.g. Joy Sanctus">
<label>Village</label>
<input id="village" placeholder="e.g. Bukulula">
<label>Crop</label>
<select id="crop">
<option>Tomato</option>
<option>Cabbage</option>
<option>Onion</option>
<option>Passion Fruit</option>
<option>Maize</option>
<option>Beans</option>
<option>Coffee</option>
</select>
<label>Land Size (Acres)</label>
<input id="acres" type="number" step="0.01" placeholder="e.g. 0.25">
<button class="primary" onclick="saveFarm()">Save Farm</button>
<div id="farmList"></div>
</div>
</main>
<script>
let farms = JSON.parse(localStorage.getItem('agritrack_farms') || '[]');
function saveFarm() {
const f = {
name: document.getElementById('farmerName').value,
village: document.getElementById('village').value,
crop: document.getElementById('crop').value,
acres: parseFloat(document.getElementById('acres').value || 0)
};
if (!f.name || !f.acres) {
alert('Enter name and acres');
return;
}
farms.push(f);
localStorage.setItem('agritrack_farms', JSON.stringify(farms));
renderFarms();
alert('Farm saved!');
}
function renderFarms() {
document.getElementById('farmList').innerHTML = farms.map(f => 
`<div><b>${f.name}</b> - ${f.village} • ${f.crop} • ${f.acres} acre</div>`
).join('');
}
renderFarms();
</script>
</body>
</html>
